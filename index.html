<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PitchMaster - Mobil Lagindelning</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
        }
        .soccer-gradient {
            background: linear-gradient(135deg, #16a34a 0%, #15803d 100%);
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .badge-yellow { background: #facc15; color: #000; }
        .badge-red { background: #ef4444; color: #fff; }
        .badge-blue { background: #3b82f6; color: #fff; }

        button:active {
            transform: scale(0.96);
        }

        input, select {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 16px !important;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }
        
        @media (max-width: 640px) {
            .container-padding { padding-left: 1rem; padding-right: 1rem; }
            .sticky-header { position: sticky; top: 0; z-index: 40; }
        }
    </style>
</head>
<body class="min-h-screen pb-20">

    <!-- Header -->
    <header class="soccer-gradient py-4 sm:py-8 px-4 text-center shadow-lg mb-4 sm:mb-8 sticky-header">
        <div class="max-w-4xl mx-auto flex items-center justify-center gap-3">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 sm:w-9 sm:h-9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/><path d="M12 2v20"/><path d="M4.93 4.93 19.07 19.07"/><path d="m4.93 19.07 14.14-14.14"/></svg>
            <h1 class="text-2xl sm:text-4xl font-extrabold tracking-tight uppercase italic">PitchMaster</h1>
        </div>
    </header>

    <main class="max-w-6xl mx-auto container-padding grid grid-cols-1 lg:grid-cols-12 gap-6 sm:gap-8">
        
        <!-- Sektion: Lägg till & Lista -->
        <div class="lg:col-span-4 space-y-6">
            
            <section class="glass-card p-5 rounded-2xl shadow-xl">
                <h2 class="text-lg font-bold mb-4 flex items-center gap-2">
                    <span class="w-1.5 h-5 bg-green-500 rounded-full"></span>
                    Lägg till spelare
                </h2>
                <div class="flex flex-col gap-4">
                    <input type="text" id="playerName" placeholder="Skriv namn..." class="w-full p-4 rounded-xl shadow-inner outline-none">
                    <div class="grid grid-cols-3 gap-2">
                        <button onclick="addPlayer('blue')" class="h-12 rounded-xl border-2 border-blue-500 text-blue-400 font-bold uppercase text-[10px] tracking-wider active:bg-blue-500 active:text-white transition-colors">Blå</button>
                        <button onclick="addPlayer('yellow')" class="h-12 rounded-xl border-2 border-yellow-500 text-yellow-400 font-bold uppercase text-[10px] tracking-wider active:bg-yellow-500 active:text-black transition-colors">Gul</button>
                        <button onclick="addPlayer('red')" class="h-12 rounded-xl border-2 border-red-500 text-red-400 font-bold uppercase text-[10px] tracking-wider active:bg-red-500 active:text-white transition-colors">Röd</button>
                    </div>
                </div>
            </section>

            <section class="glass-card p-5 rounded-2xl shadow-xl">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-bold flex items-center gap-2">
                        <span class="w-1.5 h-5 bg-green-500 rounded-full"></span>
                        Truppen (<span id="playerCount">0</span>)
                    </h2>
                    <button onclick="clearRoster()" class="text-[11px] font-bold text-red-400 uppercase">Rensa</button>
                </div>
                <div id="rosterList" class="max-h-60 overflow-y-auto space-y-2 pr-1 custom-scrollbar">
                    <p id="emptyState" class="text-gray-500 italic text-center py-6 text-sm">Inga spelare än</p>
                </div>
            </section>

            <section class="glass-card p-5 rounded-2xl border-yellow-500/10 shadow-xl">
                <h2 class="text-lg font-bold mb-4 flex items-center gap-2 text-yellow-500">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v4l3 3"/><circle cx="12" cy="12" r="10"/></svg>
                    Historik
                </h2>
                <div id="historyList" class="space-y-3 max-h-48 overflow-y-auto pr-1 custom-scrollbar">
                    <p class="text-gray-500 italic text-center py-2 text-xs">Tomt arkiv</p>
                </div>
            </section>
        </div>

        <!-- Sektion: Generering -->
        <div class="lg:col-span-8 space-y-6">
            
            <section class="glass-card p-5 rounded-2xl bg-slate-800/40 shadow-2xl">
                <h2 class="text-lg font-bold mb-5 flex items-center gap-2">
                    <span class="w-1.5 h-5 bg-yellow-500 rounded-full"></span>
                    Inställningar
                </h2>
                
                <div class="space-y-6 mb-8">
                    <div class="space-y-3">
                        <span class="text-[11px] text-gray-400 font-extrabold uppercase tracking-widest">Metod</span>
                        <div class="flex bg-slate-900/80 rounded-xl p-1.5 gap-1">
                            <button onclick="setSplitMethod('count')" id="btnMethodCount" class="flex-1 py-3 text-xs font-bold rounded-lg transition-all bg-green-600 text-white">Antal lag</button>
                            <button onclick="setSplitMethod('size')" id="btnMethodSize" class="flex-1 py-3 text-xs font-bold rounded-lg transition-all text-gray-400">Spelare / lag</button>
                        </div>
                        <div class="pt-2">
                            <input type="number" id="splitValue" value="2" min="1" max="50" class="w-full max-w-[160px] mx-auto block p-3 rounded-2xl text-center text-3xl font-black shadow-inner">
                            <p id="methodHint" class="text-[11px] text-gray-500 mt-2 text-center">Hur många lag ska skapas?</p>
                        </div>
                    </div>

                    <div class="space-y-3">
                        <span class="text-[11px] text-gray-400 font-extrabold uppercase tracking-widest">Inkludera nivåer</span>
                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                            <label class="flex items-center justify-between bg-slate-700/20 p-4 rounded-xl border border-white/5 cursor-pointer">
                                <span class="text-xs font-bold text-blue-400 uppercase">Blå</span>
                                <input type="checkbox" checked value="blue" class="filter-level w-5 h-5 accent-blue-500">
                            </label>
                            <label class="flex items-center justify-between bg-slate-700/20 p-4 rounded-xl border border-white/5 cursor-pointer">
                                <span class="text-xs font-bold text-yellow-400 uppercase">Gul</span>
                                <input type="checkbox" checked value="yellow" class="filter-level w-5 h-5 accent-yellow-500">
                            </label>
                            <label class="flex items-center justify-between bg-slate-700/20 p-4 rounded-xl border border-white/5 cursor-pointer">
                                <span class="text-xs font-bold text-red-400 uppercase">Röd</span>
                                <input type="checkbox" checked value="red" class="filter-level w-5 h-5 accent-red-500">
                            </label>
                        </div>
                    </div>
                </div>

                <button onclick="generateTeams()" class="w-full soccer-gradient py-5 rounded-2xl font-black text-xl uppercase tracking-widest shadow-2xl active:brightness-90 transition-all">
                    Generera Lag
                </button>
            </section>

            <div id="resultsWrapper" class="hidden space-y-6">
                <div class="flex flex-col gap-3 bg-slate-800/80 p-5 rounded-2xl border border-white/10 shadow-xl">
                    <input type="text" id="sessionName" placeholder="Namnge passet..." class="w-full p-3 text-sm rounded-xl outline-none">
                    <button onclick="saveCurrentTeams()" class="w-full py-4 bg-yellow-500 text-black font-black uppercase text-xs tracking-widest rounded-xl flex items-center justify-center gap-2 active:bg-yellow-400">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
                        Spara historik
                    </button>
                </div>
                
                <div id="teamsContainer" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
            </div>
        </div>
    </main>

    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-white text-slate-900 px-8 py-4 rounded-2xl font-black text-xs shadow-2xl opacity-0 transition-all pointer-events-none z-50 uppercase tracking-widest">
        Tillagd!
    </div>

    <script>
        let players = [];
        let history = [];
        let currentGeneratedTeams = null;
        let currentSplitMethod = 'count';

        window.onload = () => {
            const savedPlayers = localStorage.getItem('pm_players');
            if (savedPlayers) { players = JSON.parse(savedPlayers); renderRoster(); }
            const savedHistory = localStorage.getItem('pm_history');
            if (savedHistory) { history = JSON.parse(savedHistory); renderHistory(); }
            document.getElementById('sessionName').value = `TRÄNING ${new Date().toISOString().split('T')[0]}`;
        };

        function setSplitMethod(method) {
            currentSplitMethod = method;
            document.getElementById('btnMethodCount').className = method === 'count' ? "flex-1 py-3 text-xs font-bold rounded-lg transition-all bg-green-600 text-white shadow-lg" : "flex-1 py-3 text-xs font-bold rounded-lg transition-all text-gray-400";
            document.getElementById('btnMethodSize').className = method === 'size' ? "flex-1 py-3 text-xs font-bold rounded-lg transition-all bg-green-600 text-white shadow-lg" : "flex-1 py-3 text-xs font-bold rounded-lg transition-all text-gray-400";
            document.getElementById('methodHint').innerText = method === 'count' ? "Hur många lag ska skapas?" : "Spelare i varje lag?";
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.innerText = message; toast.style.opacity = '1';
            setTimeout(() => { toast.style.opacity = '0'; }, 2000);
        }

        function addPlayer(level) {
            const input = document.getElementById('playerName');
            const name = input.value.trim();
            if (!name) return;
            players.push({ id: Date.now(), name, level });
            localStorage.setItem('pm_players', JSON.stringify(players));
            input.value = ''; renderRoster(); showToast('TILLAGD!');
            input.focus();
        }

        function removePlayer(id) {
            players = players.filter(p => p.id !== id);
            localStorage.setItem('pm_players', JSON.stringify(players));
            renderRoster();
        }

        function clearRoster() {
            if (confirm('Rensa truppen?')) { players = []; localStorage.removeItem('pm_players'); renderRoster(); }
        }

        function renderRoster() {
            const list = document.getElementById('rosterList');
            document.getElementById('playerCount').innerText = players.length;
            if (players.length === 0) { list.innerHTML = '<p id="emptyState" class="text-gray-500 italic text-center py-6 text-sm">Inga spelare än</p>'; return; }
            list.innerHTML = players.map(p => `
                <div class="flex items-center justify-between bg-slate-800/60 p-4 rounded-xl border-l-4 border-${p.level === 'yellow' ? 'yellow-500' : p.level + '-500'}">
                    <span class="font-bold text-sm">${p.name}</span>
                    <div class="flex items-center gap-3">
                        <span class="text-[8px] uppercase font-black px-2 py-1 rounded badge-${p.level}">${p.level === 'blue' ? 'Blå' : p.level === 'yellow' ? 'Gul' : 'Röd'}</span>
                        <button onclick="removePlayer(${p.id})" class="text-gray-600"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
                    </div>
                </div>
            `).join('');
        }

        function generateTeams() {
            const val = Math.max(1, parseInt(document.getElementById('splitValue').value) || 1);
            const levels = Array.from(document.querySelectorAll('.filter-level:checked')).map(cb => cb.value);
            let pool = players.filter(p => levels.includes(p.level));
            if (pool.length === 0) { alert("Välj spelare först!"); return; }
            let teamCount = currentSplitMethod === 'count' ? val : Math.ceil(pool.length / val);
            const groups = { blue: [], yellow: [], red: [] };
            pool.forEach(p => groups[p.level].push(p));
            Object.keys(groups).forEach(k => groups[k].sort(() => Math.random() - 0.5));
            const teams = Array.from({ length: teamCount }, () => []);
            let cur = 0;
            ['red', 'yellow', 'blue'].forEach(l => groups[l].forEach(p => { teams[cur].push(p); cur = (cur + 1) % teamCount; }));
            currentGeneratedTeams = teams;
            document.getElementById('resultsWrapper').classList.remove('hidden');
            renderTeams(teams);
            setTimeout(() => document.getElementById('resultsWrapper').scrollIntoView({ behavior: 'smooth' }), 100);
        }

        function renderTeams(teams) {
            document.getElementById('teamsContainer').innerHTML = teams.map((t, i) => `
                <div class="glass-card rounded-2xl overflow-hidden shadow-2xl border border-white/10">
                    <div class="soccer-gradient px-5 py-3 flex justify-between items-center">
                        <h3 class="font-black uppercase text-xs tracking-widest">${teams.length === 1 ? 'TRUPP' : 'LAG ' + (i + 1)}</h3>
                        <span class="text-[10px] bg-black/30 px-2 py-1 rounded-full font-black">${t.length} ST</span>
                    </div>
                    <div class="p-4 space-y-2 bg-slate-900/20">
                        ${t.map(p => `<div class="flex justify-between items-center text-sm font-semibold border-b border-white/5 pb-1"><span>${p.name}</span><div class="w-2 h-2 rounded-full bg-${p.level === 'yellow' ? 'yellow-500' : p.level + '-500'}"></div></div>`).join('')}
                    </div>
                </div>
            `).join('');
        }

        function saveCurrentTeams() {
            if (!currentGeneratedTeams) return;
            history.unshift({ id: Date.now(), name: document.getElementById('sessionName').value, date: new Date().toLocaleDateString('sv-SE'), teams: currentGeneratedTeams });
            localStorage.setItem('pm_history', JSON.stringify(history));
            renderHistory(); showToast('SPARAT!');
        }

        function renderHistory() {
            const list = document.getElementById('historyList');
            if (history.length === 0) { list.innerHTML = '<p class="text-gray-500 italic text-center py-2 text-xs">Tomt arkiv</p>'; return; }
            list.innerHTML = history.map(s => `
                <div class="bg-slate-800/80 p-4 rounded-2xl border border-white/5 mb-2">
                    <div class="flex justify-between items-start mb-2 text-[10px]">
                        <div><h4 class="font-black text-yellow-500">${s.name}</h4><span class="text-gray-500">${s.date}</span></div>
                        <button onclick="deleteHistoryItem(${s.id})" class="text-gray-600"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg></button>
                    </div>
                    <button onclick='loadSession(${s.id})' class="w-full py-2 bg-slate-700/40 text-[9px] font-black uppercase rounded-lg tracking-widest">Visa</button>
                </div>
            `).join('');
        }

        function loadSession(id) {
            const s = history.find(x => x.id === id);
            if (s) { currentGeneratedTeams = s.teams; document.getElementById('resultsWrapper').classList.remove('hidden'); renderTeams(s.teams); showToast('LADDAT!'); }
        }

        function deleteHistoryItem(id) {
            if (confirm('Radera?')) { history = history.filter(x => x.id !== id); localStorage.setItem('pm_history', JSON.stringify(history)); renderHistory(); }
        }

        document.getElementById('playerName').addEventListener('keypress', (e) => { if (e.key === 'Enter') addPlayer(document.querySelector('.filter-level:checked')?.value || 'blue'); });
    </script>
</body>
</html>
